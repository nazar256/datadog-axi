---
name: CI

'on':
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests
        run: go test ./...

      - name: Build CLI
        run: go build ./cmd/datadog-axi

      - name: Validate help and built-in docs
        run: |
          go run ./cmd/datadog-axi --help >/dev/null
          go run ./cmd/datadog-axi docs commands --json >/dev/null

      - name: Smoke test release archive shape
        run: |
          set -euo pipefail
          tmpdir="$(mktemp -d)"
          trap 'rm -rf "${tmpdir}"' EXIT
          archive="datadog-axi_test_linux_amd64.tar.gz"

          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build \
            -trimpath \
            -o "${tmpdir}/datadog-axi" \
            ./cmd/datadog-axi
          tar -C "${tmpdir}" -czf "${tmpdir}/${archive}" datadog-axi
          tar -tzf "${tmpdir}/${archive}" | grep -Fx datadog-axi >/dev/null
          sha256sum "${tmpdir}/${archive}" > "${tmpdir}/checksums.txt"
          grep -F "${archive}" "${tmpdir}/checksums.txt" >/dev/null
